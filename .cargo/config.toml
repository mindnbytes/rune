# Apple's linker understands the installed SDK's TAPI architecture names.
# Large test binaries can overflow its compact-unwind writer's 24-bit offsets;
# use a compatible LLD and SDK for those tests. Do not use -no_compact_unwind:
# Rust's panic runtime needs its compact entries. This workspace config is not
# inherited by applications depending on Rune.
[target.'cfg(target_os = "macos")']
linker = "/usr/bin/clang"
