name: Snowbar overlay tests

on:
  push:
    branches:
      - 'snowbar/**'
  pull_request:
    branches:
      - 'snowbar/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snowbar-overlay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Add swap for the test build
        run: |
          sudo fallocate -l 4G /swapfile-snowbar
          sudo chmod 600 /swapfile-snowbar
          sudo mkswap /swapfile-snowbar
          sudo swapon /swapfile-snowbar
          free -h
      - name: Test Rune overlays
        run: /usr/bin/time -v cargo test --locked -p rune --lib 'overlay::'
      - name: Report runner resources
        if: always()
        run: |
          free -h
          df -h
          sudo journalctl -k --no-pager | grep -i -E 'out of memory|oom-kill|killed process' || true
